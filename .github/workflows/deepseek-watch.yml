name: deepseek-watch
on:
  schedule:
    - cron: "0 1 * * *"   # 每天北京时间 09:00
  workflow_dispatch:
permissions:
  contents: write
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 抓取 DeepSeek 仓库更新
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: python watch.py
      - name: 推送 QQ 简报
        env:
          QQ_APPID: ${{ secrets.QQ_APPID }}
          QQ_SECRET: ${{ secrets.QQ_SECRET }}
          QQ_OPENID: ${{ secrets.QQ_OPENID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python brief.py
      - name: 保存状态
        run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add data && git commit -m "state" || true
          git push
