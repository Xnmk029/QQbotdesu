name: get-openid
on: workflow_dispatch
permissions:
  contents: write
jobs:
  openid:
    runs-on: ubuntu-latest
    environment: QQb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install websockets
      - env:
          QQ_APPID: ${{ secrets.QQ_APPID }}
          QQ_SECRET: ${{ secrets.QQ_SECRET }}
        run: python get_openid.py
      - run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add data/openid.txt && git commit -m "openid" && git push
